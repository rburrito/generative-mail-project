[project]
name = "genmail-server"
version = "0.1.0"
description = "AI-powered email"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",          # CVE-2026-27205
    "werkzeug>=3.1.6",       # CVE-2026-27199 (transitive via flask; pinned to the fix)
    "flask-cors>=6.0.2",
    "flask-sqlalchemy>=3.1.1",
    "flask-limiter>=3.8",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "fastmcp>=0.2.0",
    "instructor>=1.0.0",
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
